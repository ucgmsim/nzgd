deduplication:
  hash_pass:
    stream_chunk_size: 100000

  fuzzy_pass:
    spatial_radius_m: 50
    date_window_days: 90
    name_similarity_min: 80
    trace_score_max: 0.05
    trace_resample_step_m: 0.05

  calibration:
    random_pair_sample_size: 5000

  output:
    deduped_db_suffix: "_deduped"
    report_filename: "dedup_report.csv"
    calibration_report_filename: "calibration_report.csv"
    failures_filename: "dedup_failures.csv"
    supplemental_consolidation_report_filename: "supplemental_consolidation_report.csv"

  within_record_supplemental:
    small_spread_threshold:
      predrill_depth_m:   0.5
      extracted_gwl_m:    0.5
      tip_net_area_ratio: 0.05

  within_record:
    canonical_selector: nzgd.dedup.canonical_selectors.default_within_record_canonical
    # Record types that run Pass 0 (within-record consolidation). SPT is
    # excluded because every SPT report is one source file (no _sheet_
    # expansion), so the only Pass 0 mechanism is cross-stem trace matching,
    # which would merge AGS and PDF copies of the same borehole — not what
    # we want.
    enabled_record_types: ["CPT"]

  field_plausibility_ranges:
    nzgdrecord:
      latitude:                                  [-47.5, -33.5]
      longitude:                                 [165.0, 180.0]
      model_vs30_foster_2019_m_per_s:            [50.0, 2000.0]
      model_vs30_stddev_foster_2019_ln:          [0.0, 10.0]
      model_gwl_westerhoff_2018_m:               [0.0, 100.0]
      model_gwl_nlm_2025_m:                      [0.0, 100.0]
      model_gwl_nlm_2025_stddev_m:               [0.0, 100.0]
    cptreport:
      extracted_gwl_m:     [0.01, 50.0]
      tip_net_area_ratio:  [0.5, 1.0]
      predrill_depth_m:    [0.0, 30.0]
    sptreport:
      extracted_gwl_m:     [0.01, 50.0]